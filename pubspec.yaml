name: tensorflow_demo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  tflite_flutter: 0.11.0
  image: ^4.5.2
  image_picker: ^1.1.2
  camera: ^0.10.6
  retrofit: ^4.10.0
  json_annotation: ^4.8.1
  dio: ^5.4.3+1
  mobx: ^2.3.3+2
  flutter_mobx: ^2.2.1+1
  provider: ^6.1.2
  flutter_svg: ^2.0.17
  google_mlkit_text_recognition: ^0.13.0
  path_provider: ^2.1.2
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.13
  retrofit_generator: ^10.2.9
  json_serializable: ^6.8.0
  mobx_codegen: ^2.6.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/model/
    - assets/label/
    - assets/vectors/
