pluginManagement {
    try {
        def peClass = Class.forName("java.lang.ProcessEnvironment")
        def f1 = peClass.getDeclaredField("theEnvironment")
        f1.setAccessible(true)
        f1.get(null).remove("ANDROID_PREFS_ROOT")
        def f2 = peClass.getDeclaredField("theCaseInsensitiveEnvironment")
        f2.setAccessible(true)
        f2.get(null).remove("ANDROID_PREFS_ROOT")
    } catch (ignored) {}

    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.android.application') {
                useModule('com.android.tools.build:gradle:8.9.1')
            }
            if (requested.id.id == 'org.jetbrains.kotlin.android') {
                useModule('org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0')
            }
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader"
    id "com.android.application" version "8.9.1" apply false
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.3.15" apply false
    // END: FlutterFire Configuration
    id "org.jetbrains.kotlin.android" version "2.3.0" apply false
}

include ":app"
